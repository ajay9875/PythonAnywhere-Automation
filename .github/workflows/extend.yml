name: Extend PythonAnywhere WebApp

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  extend-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account:
          - username: ${{ secrets.PA_USERNAME_1 }}
            password: ${{ secrets.PA_PASSWORD_1 }}
          - username: ${{ secrets.PA_USERNAME_2 }}
            password: ${{ secrets.PA_PASSWORD_2 }}
          - username: ${{ secrets.PA_USERNAME_3 }}
            password: ${{ secrets.PA_PASSWORD_3 }}
          - username: ${{ secrets.PA_USERNAME_4 }}
            password: ${{ secrets.PA_PASSWORD_4 }}
          - username: ${{ secrets.PA_USERNAME_5 }}
            password: ${{ secrets.PA_PASSWORD_5 }}
          - username: ${{ secrets.PA_USERNAME_6 }}
            password: ${{ secrets.PA_PASSWORD_6 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Extension Script
        env:
          PA_USERNAME: ${{ matrix.account.username }}
          PA_PASSWORD: ${{ matrix.account.password }}
        run: python extend_pythonanywhere.py