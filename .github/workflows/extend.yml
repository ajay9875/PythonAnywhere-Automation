name: Extend PythonAnywhere WebApp

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  extend-app:
    name: extend-account - ${{ matrix.username }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - username: 'MutulFundRecommender'
            secret_idx: 1
          - username: 'AiTourGuide'
            secret_idx: 2
          - username: 'TaskCare360'
            secret_idx: 3
          - username: 'king9'
            secret_idx: 4
          - username: 'BudgetWisely'
            secret_idx: 5
          - username: 'myportfolio98'
            secret_idx: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Extension Script
        env:
          PA_USERNAME: ${{ matrix.username }}
          PA_PASSWORD: ${{ secrets[format('PA_PASSWORD_{0}', matrix.secret_idx)] }}
        run: python extend_pythonanywhere.py